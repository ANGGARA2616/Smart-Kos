<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5A6477"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="580" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0E1424">Arsitektur Sistem SmartKos</text>

  <!-- Layer 1: Pengguna -->
  <rect x="170" y="64" width="560" height="86" rx="12" fill="#EAF1FB" stroke="#2F6BFF" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1A4FE0">Pengguna (Peramban / Browser)</text>
  <rect x="200" y="102" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#9DBEF5"/>
  <text x="275" y="124" text-anchor="middle" font-size="12.5" fill="#0E1424">Calon Penghuni</text>
  <rect x="375" y="102" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#9DBEF5"/>
  <text x="450" y="124" text-anchor="middle" font-size="12.5" fill="#0E1424">Penghuni</text>
  <rect x="550" y="102" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#9DBEF5"/>
  <text x="625" y="124" text-anchor="middle" font-size="12.5" fill="#0E1424">Admin</text>

  <!-- Arrow down with label -->
  <line x1="450" y1="150" x2="450" y2="196" stroke="#5A6477" stroke-width="2" marker-end="url(#arr)"/>
  <text x="462" y="178" font-size="12" fill="#5A6477" font-style="italic">HTTPS</text>

  <!-- Layer 2: Next.js app -->
  <rect x="130" y="198" width="640" height="124" rx="12" fill="#F4F7FE" stroke="#0E2A47" stroke-width="2"/>
  <text x="450" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#0E2A47">Aplikasi Next.js 16 (App Router) — Vercel</text>
  <rect x="160" y="236" width="270" height="68" rx="10" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/>
  <text x="295" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0E1424">Antarmuka (Frontend)</text>
  <text x="295" y="284" text-anchor="middle" font-size="12" fill="#5A6477">React 19 + Tailwind CSS</text>
  <rect x="470" y="236" width="270" height="68" rx="10" fill="#FFFFFF" stroke="#16A572" stroke-width="1.5"/>
  <text x="605" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0E1424">Server Actions (Backend)</text>
  <text x="605" y="284" text-anchor="middle" font-size="12" fill="#5A6477">Autentikasi JWT + bcrypt</text>

  <!-- Arrows down to services -->
  <line x1="230" y1="322" x2="170" y2="430" stroke="#5A6477" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="322" x2="450" y2="430" stroke="#5A6477" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="660" y1="322" x2="730" y2="430" stroke="#5A6477" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 3: services -->
  <rect x="60" y="432" width="220" height="92" rx="12" fill="#EAF0FF" stroke="#1A4FE0" stroke-width="2"/>
  <text x="170" y="466" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1A4FE0">PostgreSQL</text>
  <text x="170" y="488" text-anchor="middle" font-size="12.5" fill="#0E1424">Basis Data (Prisma ORM)</text>
  <text x="170" y="508" text-anchor="middle" font-size="11.5" fill="#5A6477">menyimpan &amp; membaca data</text>

  <rect x="340" y="432" width="220" height="92" rx="12" fill="#E7F7EE" stroke="#16A572" stroke-width="2"/>
  <text x="450" y="466" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0E8F60">Supabase Storage</text>
  <text x="450" y="488" text-anchor="middle" font-size="12.5" fill="#0E1424">Penyimpanan Berkas</text>
  <text x="450" y="508" text-anchor="middle" font-size="11.5" fill="#5A6477">foto kamar, bukti transfer</text>

  <rect x="620" y="432" width="220" height="92" rx="12" fill="#FFF4E0" stroke="#B7791F" stroke-width="2"/>
  <text x="730" y="466" text-anchor="middle" font-size="14.5" font-weight="700" fill="#B7791F">Resend</text>
  <text x="730" y="488" text-anchor="middle" font-size="12.5" fill="#0E1424">Layanan Email</text>
  <text x="730" y="508" text-anchor="middle" font-size="11.5" fill="#5A6477">notifikasi ke admin</text>

  <text x="450" y="556" text-anchor="middle" font-size="11.5" fill="#9AA3B4">Gambar 3.1 Arsitektur Sistem SmartKos</text>
</svg>
