<svg xmlns="http://www.w3.org/2000/svg" width="880" height="740" viewBox="0 0 880 740" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5A6477"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="740" fill="#FFFFFF"/>
  <text x="380" y="22" text-anchor="middle" font-size="18" font-weight="700" fill="#0E1424">Alur Pemesanan dan Verifikasi Pembayaran</text>

  <!-- Mulai -->
  <rect x="310" y="32" width="140" height="44" rx="22" fill="#0E2A47"/>
  <text x="380" y="59" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">Mulai</text>
  <line x1="380" y1="76" x2="380" y2="98" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>

  <!-- Login -->
  <rect x="250" y="100" width="260" height="46" rx="8" fill="#EAF1FB" stroke="#2F6BFF" stroke-width="1.6"/>
  <text x="380" y="128" text-anchor="middle" font-size="13" fill="#0E1424">Calon penghuni mendaftar / login</text>
  <line x1="380" y1="146" x2="380" y2="166" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>

  <!-- Pilih kamar -->
  <rect x="250" y="168" width="260" height="46" rx="8" fill="#EAF1FB" stroke="#2F6BFF" stroke-width="1.6"/>
  <text x="380" y="196" text-anchor="middle" font-size="13" fill="#0E1424">Pilih kamar kosong &amp; durasi sewa</text>
  <line x1="380" y1="214" x2="380" y2="234" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>

  <!-- Upload bukti -->
  <rect x="250" y="236" width="260" height="46" rx="8" fill="#EAF1FB" stroke="#2F6BFF" stroke-width="1.6"/>
  <text x="380" y="264" text-anchor="middle" font-size="13" fill="#0E1424">Unggah bukti transfer</text>
  <line x1="380" y1="282" x2="380" y2="302" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>

  <!-- Buat booking -->
  <rect x="240" y="304" width="280" height="58" rx="8" fill="#EAF1FB" stroke="#2F6BFF" stroke-width="1.6"/>
  <text x="380" y="328" text-anchor="middle" font-size="12.5" fill="#0E1424">Sistem membuat Booking (status PENDING)</text>
  <text x="380" y="348" text-anchor="middle" font-size="12.5" fill="#0E1424">&amp; mengirim notifikasi email ke admin</text>
  <line x1="380" y1="362" x2="380" y2="382" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>

  <!-- Admin verifikasi -->
  <rect x="250" y="384" width="260" height="46" rx="8" fill="#EAF1FB" stroke="#2F6BFF" stroke-width="1.6"/>
  <text x="380" y="412" text-anchor="middle" font-size="13" fill="#0E1424">Admin memeriksa bukti pembayaran</text>
  <line x1="380" y1="430" x2="380" y2="444" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>

  <!-- Decision -->
  <polygon points="380,446 462,496 380,546 298,496" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.8"/>
  <text x="380" y="501" text-anchor="middle" font-size="13" font-weight="700" fill="#B7791F">Disetujui?</text>

  <!-- Ya branch down -->
  <line x1="380" y1="546" x2="380" y2="568" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>
  <text x="394" y="562" font-size="12" font-weight="700" fill="#16A572">Ya</text>

  <!-- Approved box -->
  <rect x="232" y="570" width="296" height="66" rx="8" fill="#E7F7EE" stroke="#16A572" stroke-width="1.8"/>
  <text x="380" y="592" text-anchor="middle" font-size="12.5" fill="#0E1424">Pemesanan APPROVED, kamar menjadi TERISI,</text>
  <text x="380" y="610" text-anchor="middle" font-size="12.5" fill="#0E1424">pengguna menjadi PENGHUNI, &amp; tanggal</text>
  <text x="380" y="628" text-anchor="middle" font-size="12.5" fill="#0E1424">berakhir sewa dihitung otomatis</text>
  <line x1="380" y1="636" x2="380" y2="658" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>

  <!-- Selesai -->
  <rect x="310" y="660" width="140" height="44" rx="22" fill="#0E2A47"/>
  <text x="380" y="687" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">Selesai</text>

  <!-- Tidak branch (right) -->
  <line x1="462" y1="496" x2="600" y2="496" stroke="#5A6477" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="486" text-anchor="middle" font-size="12" font-weight="700" fill="#E5484D">Tidak</text>
  <rect x="600" y="472" width="248" height="48" rx="8" fill="#FDECEC" stroke="#E5484D" stroke-width="1.8"/>
  <text x="724" y="496" text-anchor="middle" font-size="12.5" fill="#0E1424">Pemesanan ditolak</text>
  <text x="724" y="512" text-anchor="middle" font-size="11.5" fill="#5A6477">(status REJECTED)</text>

  <!-- Loop back: REJECTED up to Pilih kamar -->
  <polyline points="724,472 724,191 510,191" fill="none" stroke="#5A6477" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="735" y="330" font-size="12" font-style="italic" fill="#5A6477">Pesan ulang</text>
</svg>
